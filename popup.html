<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Jobs: Company Blocker</title>
    <style>
      /* Reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Layout */
      body {
        background: #fff;
        color: #333;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        min-height: 300px;
        padding: 16px;
        width: 400px;
      }

      .button-container {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      /* Typography */
      h1 {
        color: #0a66c2;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .instructions {
        color: #666;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 12px;
      }

      /* Form elements */
      textarea {
        border-radius: 4px;
        border: 1px solid #ccc;
        font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.6;
        margin-bottom: 12px;
        min-height: 200px;
        padding: 8px;
        resize: vertical;
        width: 100%;
      }

      textarea:focus {
        border-color: #0a66c2;
        box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.1);
        outline: none;
      }

      /* Buttons */
      button {
        border-radius: 16px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        padding: 8px 16px;
        transition: background-color 0.2s ease;
      }

      .save-btn {
        background-color: #0a66c2;
        color: white;
      }

      .save-btn:hover {
        background-color: #004182;
      }

      /* Status messages */
      .status-message {
        border-radius: 4px;
        display: none;
        font-size: 13px;
        margin-top: 8px;
        padding: 8px;
        text-align: center;
      }

      .status-message.success {
        background-color: #d4edda;
        color: #155724;
        display: block;
      }

      .status-message.error {
        background-color: #f8d7da;
        color: #721c24;
        display: block;
      }

      /* Count */
      .count {
        color: #666;
        font-size: 12px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Blocked Companies</h1>

    <p class="instructions">
      Enter one company name per line. Company names are case-sensitive and must match exactly.
    </p>

    <div class="count" id="count">0 companies blocked</div>

    <textarea id="companiesList" rows="10"></textarea>

    <div class="button-container">
      <button class="save-btn" id="saveBtn">Save</button>
    </div>

    <div class="status-message" id="statusMessage"></div>

    <script src="popup.js"></script>
  </body>
</html>
